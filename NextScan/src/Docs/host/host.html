<!DOCTYPE html>
<!--
  NextScan - the page one open document lives in.

  It holds nothing of its own: ONLYOFFICE's editor in an iframe, started with
  the document the application converted for it (host.js), and the shim that
  lets that editor run with no Document Server behind it (shim.js, injected by
  the application into the editor's own frame).
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #editor { width: 100%; height: 100%; }
  </style>
  <script src="/editors/web-apps/apps/api/documents/api.js"></script>
  <script src="host.js"></script>
</head>
<body>
  <div id="editor"></div>
</body>
</html>
